  <link id="kermit-stylesheet" rel="stylesheet" href="/assets/styles.css" />
  <script>
  (function(){
    const primary = document.getElementById('kermit-stylesheet');
    const fallbacks = ['assets/styles.css', './assets/styles.css'];
    let i = 0;
    function tryNext() { if (i>=fallbacks.length) return console.error('styles.css not found', fallbacks); const l=document.createElement('link'); l.rel='stylesheet'; l.href=fallbacks[i++]; l.onload=()=>console.info('Loaded stylesheet:',l.href); l.onerror=()=>{l.remove(); tryNext();}; document.head.appendChild(l);} if (primary) primary.onerror = tryNext; setTimeout(()=>{const loaded=Array.from(document.styleSheets).some(s=>s.href&&s.href.includes('styles.css')); if(!loaded) tryNext();},250);
  })();
  </script>
  <script src="/assets/theme.js" defer></script>
  <script src="/assets/animation.js" defer></script>
  <script src="/assets/cursor.js" defer></script>
  <script src="/assets/nav.js" defer></script>
